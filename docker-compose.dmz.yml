services:
  dmz_collector:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REPO_URL: https://github.com/Abdoun1m/dmz_collector
        REPO_BRANCH: main
    container_name: dmz_collector
    network_mode: none
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    ports:
      - "9000:9000"
      - "5514:5514/udp"
    environment:
      API_ADDR: 0.0.0.0:9000
      STORAGE_BACKEND: jsonl
      EVENTS_FILE: /data/events.jsonl
      SPOOL_FILE: /data/spool/events.jsonl
      DMZ_INGEST_TOKEN: ""
      SPLUNK_HEC_ENABLED: "false"
      SPLUNK_HEC_URL: ""
      SPLUNK_HEC_TOKEN: ""
      SPLUNK_INDEX: "ot_security"
      SPLUNK_SOURCE: "labshock_dmz_collector"
      SPLUNK_VERIFY_TLS: "false"
      SYSLOG_FORWARD_ENABLED: "false"
      SYSLOG_FORWARD_HOST: ""
      SYSLOG_FORWARD_PORT: "514"
      SYSLOG_FORWARD_PROTOCOL: "udp"
      VAULT_ENABLED: "false"
      VAULT_ADDR: "http://192.168.10.10:8200"
      VAULT_TOKEN: ""
      VAULT_SECRET_PATH: "secret/data/dmz_collector/splunk"
      FIREWALL_SYSLOG_ENABLED: "true"
      FIREWALL_SYSLOG_ADDR: "0.0.0.0:5514"
      OT_PULL_ENABLED: "false"
      OT_COLLECTOR_URL: "http://192.168.1.70:8088"
      OT_PULL_INTERVAL_SECONDS: "10"
      OT_SSE_ENABLED: "false"
      FORWARD_BATCH_SIZE: "50"
      DMZ_SELF_TELEMETRY_ENABLED: "true"
      DMZ_SELF_TELEMETRY_INTERVAL_SECONDS: "60"
      DMZ_SELF_TELEMETRY_SPOOL_WARN_EVENTS: "1000"
      DMZ_SELF_TELEMETRY_SPOOL_CRITICAL_EVENTS: "10000"
      DMZ_SELF_TELEMETRY_EVENT_FLOW: "true"
    volumes:
      - dmz-collector-data:/data

volumes:
  dmz-collector-data:
