<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DataProtect DMZ Collector</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-logo">DP</div>
      <div class="brand-text">
        <h1>DataProtect DMZ Collector</h1>
        <p>DMZ Security Telemetry Hub</p>
      </div>
    </div>
    <div class="topbar-sep"></div>
    <div class="topbar-chips">
      <span class="chip chip-cyan"><span class="dot"></span>DMZ Zone</span>
      <span id="health-pill" class="chip">status: offline</span>
      <span id="rate-pill" class="chip chip-dim">0 ev/s</span>
      <span id="fwd-pill" class="chip chip-dim">fwd off</span>
      <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark mode">&#9790;</button>
    </div>
  </header>

  <div class="app-shell">

    <aside class="sidebar">
      <div class="sidebar-section-label">Navigation</div>
      <nav class="tabs">
        <button data-tab="dashboard" class="active">
          <span class="nav-icon">&#9671;</span>
          <span class="nav-label">Dashboard</span>
        </button>
        <button data-tab="events">
          <span class="nav-icon">&#9783;</span>
          <span class="nav-label">Events</span>
        </button>
        <button data-tab="sources">
          <span class="nav-icon">&#9673;</span>
          <span class="nav-label">Sources</span>
        </button>
        <button data-tab="queue">
          <span class="nav-icon">&#8679;</span>
          <span class="nav-label">Queue</span>
        </button>
        <button data-tab="forwarding">
          <span class="nav-icon">&#8658;</span>
          <span class="nav-label">Forwarding</span>
        </button>
        <button data-tab="rules">
          <span class="nav-icon">&#9883;</span>
          <span class="nav-label">Rule Matrix</span>
        </button>
        <button data-tab="splunk">
          <span class="nav-icon">&#9670;</span>
          <span class="nav-label">SIEM / Routing</span>
        </button>
        <button data-tab="settings">
          <span class="nav-icon">&#9965;</span>
          <span class="nav-label">Diagnostics</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item">
          <span>&#9632;</span>
          <span>DataProtect v2</span>
        </div>
      </div>
    </aside>

    <main>
      <section id="tab-dashboard"  class="tab active"></section>
      <section id="tab-events"     class="tab"></section>
      <section id="tab-sources"    class="tab"></section>
      <section id="tab-queue"      class="tab"></section>
      <section id="tab-forwarding" class="tab"></section>
      <section id="tab-rules"      class="tab"></section>
      <section id="tab-splunk"     class="tab"></section>
      <section id="tab-settings"   class="tab"></section>
    </main>

  </div><!-- /.app-shell -->

  <dialog id="json-modal">
    <div class="modal-header">
      <h3>Event Details</h3>
      <button id="json-modal-close" class="btn-sm secondary">&#10005; Close</button>
    </div>
    <div class="modal-body">
      <pre id="json-modal-body"></pre>
    </div>
    <div class="modal-footer" id="json-modal-footer"></div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
